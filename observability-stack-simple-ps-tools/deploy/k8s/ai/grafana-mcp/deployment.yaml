apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana-mcp
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: grafana-mcp
  template:
    metadata:
      labels:
        app.kubernetes.io/name: grafana-mcp
    spec:
      containers:
        - name: grafana-mcp
          image: grafana/mcp-grafana:1.1.0
          imagePullPolicy: IfNotPresent
          args:
            - -t
            - streamable-http
            - -address
            - 0.0.0.0:8000
            - -allowed-hosts
            - "*"
          env:
            - name: GRAFANA_URL
              value: http://grafana.observability.svc.cluster.local
            - name: GRAFANA_USERNAME
              value: admin
            - name: GRAFANA_PASSWORD
              value: admin
            - name: MCP_GRAFANA_SERVER_TOKEN
              valueFrom:
                secretKeyRef:
                  name: grafana-mcp-auth
                  key: server-token
          ports:
            - name: http
              containerPort: 8000
          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 20
            periodSeconds: 20
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
