apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: storage
generatorOptions:
  disableNameSuffixHash: true
resources:
  - namespace.yaml
  - service.yaml
  - statefulset.yaml
configMapGenerator:
  - name: garage-config
    files:
      - garage.toml
secretGenerator:
  - name: garage-bootstrap
    envs:
      - bootstrap.env
